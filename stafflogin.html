<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>
    <link rel="stylesheet" href="staff-style.css">
</head>

<body class="login-page">

<div class="login-container">

    <div class="login-left">
        <div class="login-logo">🎓</div>
        <h1>Guide Portal</h1>
        <p>Project Management System</p>

        <div class="login-info">
            <span>✓</span> Manage Students
            <br>
            <span>✓</span> Review Projects
            <br>
            <span>✓</span> Track Progress
        </div>
    </div>

    <div class="login-right">

        <form id="staffLoginForm">

            <h2>Staff Login</h2>
            <p class="small-text">Sign in to your guide account</p>

            <label>Email Address</label>
            <input type="email" id="staffEmail"
                   placeholder="Enter email" required>

            <label>Password</label>
            <input type="password" id="staffPassword"
                   placeholder="Enter password" required>

            <button type="submit" class="btn primary-btn">
                Login →
            </button>

            <p id="loginMessage"></p>

            <div class="demo-login">
                <b>Demo Login</b><br>
                Email: staff@gmail.com<br>
                Password: 12345
            </div>

        </form>

    </div>

</div>

<script src="staff-script.js"></script>
</body>
</html>
