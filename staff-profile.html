<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Profile</title>
    <link rel="stylesheet" href="staff-style.css">
</head>

<body>

<div class="layout">

<aside class="sidebar cyan-sidebar">

    <div class="brand">🎓 <span>Guide Portal</span></div>

    <nav>
        <a href="staff-dashboard.html">📊 Dashboard</a>
        <a href="staff-profile.html" class="active">👤 My Profile</a>
        <a href="student-list.html">👨‍🎓 Students</a>
        <a href="project-list.html">📁 Projects</a>
        <a href="project-review.html">✅ Project Review</a>
        <a href="document-review.html">📄 Documents</a>
        <a href="give-feedback.html">💬 Feedback</a>
        <a href="project-status-update.html">🔄 Status Update</a>
    </nav>

    <button onclick="staffLogout()" class="logout-btn">🚪 Logout</button>

</aside>


<main class="main-content">

<header class="topbar">
    <div>
        <h2>My Profile</h2>
        <p>Manage your staff information</p>
    </div>
</header>


<div class="profile-cover">

    <div class="large-avatar">
        DP
    </div>

    <div>
        <h1>Dr. Priya Dharshini</h1>
        <p>Project Guide • Computer Science Department</p>
    </div>

</div>


<section class="form-card">

<h2>Personal Information</h2>

<form id="staffProfileForm">

    <div class="form-grid">

        <div>
            <label>Full Name</label>
            <input type="text" id="profileName"
                   value="Dr. Priya Dharshini">
        </div>

        <div>
            <label>Email</label>
            <input type="email" id="profileEmail"
                   value="staff@gmail.com">
        </div>

        <div>
            <label>Department</label>
            <input type="text"
                   value="Computer Science and Engineering">
        </div>

        <div>
            <label>Designation</label>
            <input type="text"
                   value="Assistant Professor">
        </div>

        <div>
            <label>Phone Number</label>
            <input type="text"
                   value="9876543210">
        </div>

        <div>
            <label>Experience</label>
            <input type="text"
                   value="8 Years">
        </div>

    </div>

    <button class="btn primary-btn" type="submit">
        Save Changes
    </button>

    <p id="profileMessage"></p>

</form>

</section>

</main>

</div>

<script src="staff-script.js"></script>

</body>
</html>
